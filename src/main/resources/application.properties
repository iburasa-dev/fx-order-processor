# Application Name
spring.application.name=fx-order-processor
server.port=8080

# PostgreSQL Datasource Configuration
# Override via environment variables DB_URL, DB_USERNAME, DB_PASSWORD if needed
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fx_orders_db}
spring.datasource.username=${DB_USERNAME:app_user}
spring.datasource.password=${DB_PASSWORD:AppUserSecure2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Settings
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# In-Memory Cache (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=exchangeRates
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=600s

# FX Rate Provider (Frankfurter v2)
fx.api.frankfurter.base-url=https://api.frankfurter.dev/v2
fx.api.timeout.connect-millis=3000
fx.api.timeout.read-millis=4000

# Fee Configuration
fx.fee.threshold-usd=1000.00
fx.fee.under-threshold-percent=0.0150
fx.fee.above-threshold-percent=0.0050


# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
